<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProTrade Analyzer | Professional Trading Analysis</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="#" class="brand">
      <i class="fas fa-chart-line brand-icon"></i>
      <span>ProTrade Analyzer</span>
    </a>
    <button class="btn btn-outline" onclick="logout()">
      <i class="fas fa-sign-out-alt btn-icon"></i>
      Logout
    </button>
  </nav>

  <div class="container">
    <div class="card">
      <div class="card-header">
        <h2>Chart Analysis Dashboard</h2>
      </div>
      <div class="card-body">
        <div class="input-group">
          <label for="screenshot">Upload Trading Chart</label>
          <div class="upload-area" id="dropZone">
            <i class="fas fa-cloud-upload-alt upload-icon"></i>
            <p class="upload-text">Drag & drop your chart screenshot here or click to browse</p>
            <input type="file" id="screenshot" class="file-input" accept="image/*">
            <button class="btn btn-outline">
              <i class="fas fa-folder-open btn-icon"></i>
              Select File
            </button>
            <div id="fileName" class="file-name"></div>
          </div>
        </div>

        <button id="analyzeBtn" class="btn btn-primary btn-block" onclick="analyzeChart()">
          <i class="fas fa-chart-pie btn-icon"></i>
          Analyze Chart
        </button>

        <div id="resultsContainer" class="analysis-results hidden">
          <h3>Trade Analysis Results</h3>
          
          <div class="result-item">
            <span class="result-label">
              <i class="fas fa-sign-in-alt result-icon"></i>
              Entry Point
            </span>
            <span id="entry" class="result-value">--</span>
          </div>
          
          <div class="result-item">
            <span class="result-label">
              <i class="fas fa-shield-alt result-icon"></i>
              Stop Loss
            </span>
            <span id="stoploss" class="result-value">--</span>
          </div>
          
          <div class="result-item">
            <span class="result-label">
              <i class="fas fa-dollar-sign result-icon"></i>
              Average Buy
            </span>
            <span id="avg" class="result-value">--</span>
          </div>
          
          <div class="result-item">
            <span class="result-label">
              <i class="fas fa-bullseye result-icon"></i>
              Target Price
            </span>
            <span id="target" class="result-value">--</span>
          </div>
          
          <div class="result-item">
            <span class="result-label">
              <i class="fas fa-coins result-icon"></i>
              Potential Profit
            </span>
            <span id="profit" class="result-value profit-value">--</span>
          </div>
          
          <div class="confidence-meter mt-3">
            <div class="confidence-bar">
              <div id="confidenceFill" class="confidence-fill" style="width: 0%"></div>
            </div>
            <div class="confidence-text">
              <span>Analysis Confidence</span>
              <span id="confidenceValue">0%</span>
            </div>
          </div>
        </div>

        <div id="errorMessage" class="mt-3 text-center" style="color: var(--danger);"></div>
      </div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Check authentication
    if (!localStorage.getItem("user")) {
      window.location.href = "login.html";
    }

    // Drag and drop functionality
    document.addEventListener('DOMContentLoaded', function() {
      const dropZone = document.getElementById('dropZone');
      const fileInput = document.getElementById('screenshot');
      const fileName = document.getElementById('fileName');

      // Click to select file
      dropZone.addEventListener('click', function() {
        fileInput.click();
      });

      // File input change
      fileInput.addEventListener('change', function() {
        if (fileInput.files.length) {
          fileName.textContent = fileInput.files[0].name;
        }
      });

      // Drag over
      dropZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        dropZone.style.borderColor = var(--primary);
        dropZone.style.backgroundColor = 'rgba(41, 98, 255, 0.05)';
      });

      // Drag leave
      dropZone.addEventListener('dragleave', function() {
        dropZone.style.borderColor = '#E0E0E0';
        dropZone.style.backgroundColor = var(--light);
      });

      // Drop
      dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        dropZone.style.borderColor = '#E0E0E0';
        dropZone.style.backgroundColor = var(--light);

        if (e.dataTransfer.files.length) {
          fileInput.files = e.dataTransfer.files;
          fileName.textContent = fileInput.files[0].name;
        }
      });
    });

    // Logout function
    window.logout = function() {
      localStorage.removeItem("user");
      window.location.href = "login.html";
    };
  </script>
</body>
</html>
