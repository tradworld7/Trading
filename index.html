<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Trade World</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {margin: 0;padding: 0;box-sizing: border-box;font-family: 'Poppins', sans-serif;}
    body {display: flex;min-height: 100vh;background: #f6f9fc;}
    .sidebar {width: 220px;background: #222;color: #fff;padding: 1rem 0;position: fixed;top: 0;bottom: 0;left: 0;z-index: 100;}
    .sidebar h3 {text-align: center;margin-bottom: 2rem;}
    .sidebar a {display: block;color: #fff;padding: 0.75rem 1.5rem;text-decoration: none;transition: background 0.3s;}
    .sidebar a:hover {background: #333;}
    .main {margin-left: 220px;padding: 2rem;width: 100%;}
    header {background: #fff;padding: 1rem 2rem;border-radius: 8px;margin-bottom: 1.5rem;box-shadow: 0 0 10px rgba(0,0,0,0.05);}
    .welcome {font-size: 1.25rem;font-weight: 500;}
    .dashboard-cards {display: grid;grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));gap: 1rem;margin-bottom: 2rem;}
    .card {background: #fff;padding: 1rem;border-radius: 8px;box-shadow: 0 0 5px rgba(0,0,0,0.05);}
    .card h4 {font-size: 1rem;margin-bottom: 0.5rem;}
    .card .value {font-size: 1.5rem;font-weight: 600;}
    .section-title {font-weight: 600;font-size: 1.1rem;margin-bottom: 0.5rem;}
    .transaction-list {background: #fff;padding: 1rem;border-radius: 8px;box-shadow: 0 0 5px rgba(0,0,0,0.05);}
    .transaction-item {padding: 0.6rem 0;border-bottom: 1px solid #eee;}
    .transaction-item:last-child {border-bottom: none;}
  </style>
</head>
<body>
  <div class="sidebar">
    <h3>Trade World</h3>
    <a href="profile.html">My Profile</a>
    <a href="#" id="logout">Logout</a>
  </div>

  <div class="main">
    <header>
      <div class="welcome" id="userName">Welcome, User</div>
    </header>

    <div class="dashboard-cards">
      <div class="card">
        <h4>My Balance</h4>
        <div class="value" id="myBalance">$0.00</div>
      </div>
      <div class="card">
        <h4>Trading Profit</h4>
        <div class="value" id="tradingProfit">$0.00</div>
      </div>
      <div class="card">
        <h4>Direct Referrals</h4>
        <div class="value" id="directReferrals">0</div>
        <small id="referralEarnings">Earnings: $0.00</small>
      </div>
      <div class="card">
        <h4>Total Team Earnings</h4>
        <div class="value" id="teamEarnings">$0.00</div>
      </div>
    </div>

    <section style="margin-top: 2rem;">
      <div class="section-title">Recent Transactions</div>
      <div class="transaction-list" id="transactionList">
        <div>Loading transactions...</div>
      </div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-auth.js";
    import { getDatabase, ref, get, onValue } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCzHmIimieea8H9KzYFDSqD0lGOCZjxHYw",
      authDomain: "myapp-ee226.firebaseapp.com",
      databaseURL: "https://myapp-ee226-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "myapp-ee226",
      storageBucket: "myapp-ee226.firebasestorage.app",
      messagingSenderId: "272405753135",
      appId: "1:272405753135:web:598ec27c28bcf6b04105da",
      measurementId: "G-D5KYTMJ5WK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const userName = document.getElementById('userName');
    const myBalance = document.getElementById('myBalance');
    const tradingProfit = document.getElementById('tradingProfit');
    const directReferrals = document.getElementById('directReferrals');
    const referralEarnings = document.getElementById('referralEarnings');
    const teamEarnings = document.getElementById('teamEarnings');
    const transactionList = document.getElementById('transactionList');

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userRef = ref(db, 'users/' + user.uid);
        const snap = await get(userRef);
        if (snap.exists()) {
          const data = snap.val();
          userName.textContent = `Welcome, ${data.name || 'User'}`;
          myBalance.textContent = `$${(data.balance || 0).toFixed(2)}`;
          tradingProfit.textContent = `$${(data.tradingProfit || 0).toFixed(2)}`;
          directReferrals.textContent = data.directReferrals || 0;
          referralEarnings.textContent = `Earnings: $${(data.referralEarnings || 0).toFixed(2)}`;
          teamEarnings.textContent = `$${(data.teamEarnings || 0).toFixed(2)}`;
        }

        const transactionsRef = ref(db, 'transactions');
        onValue(transactionsRef, (snapshot) => {
          if (!snapshot.exists()) {
            transactionList.innerHTML = '<div>No transactions yet.</div>';
            return;
          }
          const transactions = Object.values(snapshot.val() || {});
          const latest = transactions.sort((a,b) => b.timestamp - a.timestamp).slice(0,10);

          transactionList.innerHTML = latest.map(tx => `
            <div class="transaction-item">
              <strong>${tx.type}</strong> of $${tx.amount} by ${tx.userName || 'User'}<br/>
              <small>${new Date(tx.timestamp).toLocaleString()}</small>
            </div>
          `).join('');
        });
      } else {
        window.location.href = 'signup.html';
      }
    });

    document.getElementById('logout').addEventListener('click', () => {
      signOut(auth).then(() => {
        window.location.href = 'login.html';
      });
    });
  </script>
</body>
</html>
