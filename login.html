<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Trade World</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
    body{background:#eef2f3;display:flex;align-items:center;justify-content:center;min-height:100vh;}
    .login-container{background:#fff;padding:2rem;border-radius:10px;box-shadow:0 0 15px rgba(0,0,0,0.1);width:100%;max-width:420px;}
    h2{text-align:center;margin-bottom:1.5rem;}
    input[type="email"], input[type="password"] {
      width:100%;padding:0.75rem;margin:0.5rem 0;border:1px solid #ccc;border-radius:5px;
    }
    button{width:100%;padding:0.75rem;background:#4361ee;color:#fff;border:none;border-radius:5px;cursor:pointer;}
    button:hover{background:#3b4cca;}
    .footer-text{text-align:center;margin-top:1rem;font-size:0.9rem;}
    .footer-text a{color:#4361ee;text-decoration:none;}
    .footer-text a:hover{text-decoration:underline;}
    .error{color:red;font-size:0.85rem;margin-top:0.5rem;}
    .success{color:green;text-align:center;margin-top:1rem;}
  </style>
</head>
<body>
<div class="login-container">
  <h2>Login to Your Account</h2>
  <input type="email" id="email" placeholder="Email Address" required />
  <input type="password" id="password" placeholder="Password" required />
  <button id="loginBtn">Login</button>
  <div id="message"></div>
  <div class="footer-text">Don't have an account? <a href="signup.html">Sign Up</a></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCzHmIimieea8H9KzYFDSqD0lGOCZjxHYw",
    authDomain: "myapp-ee226.firebaseapp.com",
    databaseURL: "https://myapp-ee226-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "myapp-ee226",
    storageBucket: "myapp-ee226.firebasestorage.app",
    messagingSenderId: "272405753135",
    appId: "1:272405753135:web:598ec27c28bcf6b04105da",
    measurementId: "G-D5KYTMJ5WK"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const loginBtn = document.getElementById('loginBtn');
  const msgBox = document.getElementById('message');

  loginBtn.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      msgBox.innerHTML = '<div class="error">Please fill all fields.</div>';
      return;
    }

    try {
      await signInWithEmailAndPassword(auth, email, password);
      msgBox.innerHTML = '<div class="success">Login successful! Redirecting...</div>';
      setTimeout(() => {
        window.location.href = "index.html";
      }, 1500);
    } catch (error) {
      msgBox.innerHTML = `<div class="error">${error.message}</div>`;
    }
  });
</script>
</body>
</html>
