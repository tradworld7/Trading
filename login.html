<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ProTrade Analyzer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-header">
        <h2>Welcome Back</h2>
      </div>
      <div class="card-body">
        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email">
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password">
        </div>

        <button id="loginBtn" class="btn btn-primary btn-block" onclick="login()">
          <i class="fas fa-sign-in-alt btn-icon"></i>
          Login
        </button>

        <div class="text-center mt-3">
          <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
        </div>

        <div id="errorMessage" class="mt-3 text-center" style="color: var(--danger);"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth } from './js/firebase-config.js';
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    window.login = async function() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');
      const loginBtn = document.getElementById('loginBtn');

      if (!email || !password) {
        errorMessage.textContent = 'Please fill in all fields';
        return;
      }

      try {
        // Show loading state
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<i class="fas fa-spinner spinner btn-icon"></i> Authenticating...';

        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        localStorage.setItem("user", userCredential.user.email);
        window.location.href = "index.html";
      } catch (error) {
        console.error("Login error:", error);
        
        // User-friendly error messages
        switch(error.code) {
          case 'auth/user-not-found':
            errorMessage.textContent = 'No account found with this email';
            break;
          case 'auth/wrong-password':
            errorMessage.textContent = 'Incorrect password';
            break;
          case 'auth/invalid-email':
            errorMessage.textContent = 'Invalid email address';
            break;
          default:
            errorMessage.textContent = 'Login failed. Please try again.';
        }
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt btn-icon"></i> Login';
      }
    };

    // Allow login on Enter key
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          login();
        }
      });
    });
  </script>
</body>
</html>
