<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | ProTrade Analyzer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-header">
        <h2>Create Your Account</h2>
      </div>
      <div class="card-body">
        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email">
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Create a password (min 6 chars)">
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm your password">
        </div>

        <button id="signupBtn" class="btn btn-primary btn-block" onclick="signup()">
          <i class="fas fa-user-plus btn-icon"></i>
          Sign Up
        </button>

        <div class="text-center mt-3">
          <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>

        <div id="errorMessage" class="mt-3 text-center" style="color: var(--danger);"></div>
        <div id="successMessage" class="mt-3 text-center" style="color: var(--secondary);"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth } from './js/firebase-config.js';
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    window.signup = async function() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');
      const signupBtn = document.getElementById('signupBtn');

      // Clear messages
      errorMessage.textContent = '';
      successMessage.textContent = '';

      // Validation
      if (!email || !password || !confirmPassword) {
        errorMessage.textContent = 'Please fill in all fields';
        return;
      }

      if (password !== confirmPassword) {
        errorMessage.textContent = 'Passwords do not match';
        return;
      }

      if (password.length < 6) {
        errorMessage.textContent = 'Password must be at least 6 characters';
        return;
      }

      try {
        // Show loading state
        signupBtn.disabled = true;
        signupBtn.innerHTML = '<i class="fas fa-spinner spinner btn-icon"></i> Creating account...';

        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        successMessage.textContent = 'Account created successfully! Redirecting...';
        
        // Store user in localStorage and redirect
        localStorage.setItem("user", userCredential.user.email);
        setTimeout(() => {
          window.location.href = "index.html";
        }, 1500);
      } catch (error) {
        console.error("Signup error:", error);
        
        // User-friendly error messages
        switch(error.code) {
          case 'auth/email-already-in-use':
            errorMessage.textContent = 'Email already in use';
            break;
          case 'auth/invalid-email':
            errorMessage.textContent = 'Invalid email address';
            break;
          case 'auth/weak-password':
            errorMessage.textContent = 'Password is too weak';
            break;
          default:
            errorMessage.textContent = 'Account creation failed. Please try again.';
        }
      } finally {
        signupBtn.disabled = false;
        signupBtn.innerHTML = '<i class="fas fa-user-plus btn-icon"></i> Sign Up';
      }
    };

    // Allow signup on Enter key
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('confirmPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          signup();
        }
      });
    });
  </script>
</body>
</html>
