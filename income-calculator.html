<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dollar & Level Income Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: #f4f8fb;
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #fff;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    h2 {
      text-align: center;
      color: #007bff;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: 500;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      transition: 0.2s;
    }

    input[type="number"]:focus,
    input[type="text"]:focus {
      border-color: #007bff;
      box-shadow: 0 0 4px rgba(0,123,255,0.3);
    }

    button {
      width: 100%;
      background: #007bff;
      color: white;
      padding: 12px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0056b3;
    }

    .result {
      margin-top: 20px;
      background: #e9f5ff;
      border-radius: 10px;
      padding: 15px;
      border: 1px solid #bde0fe;
    }

    .result h3 {
      color: #007bff;
      text-align: center;
      margin-bottom: 10px;
    }

    .result p {
      font-size: 15px;
      margin: 4px 0;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #555;
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- 🔹 Basic Dollar Calculator -->
  <div class="container">
    <h2>💰 Dollar to INR Income Calculator</h2>

    <label>Enter Amount (USD):</label>
    <input type="number" id="usd" placeholder="e.g. 100">

    <label>Set Percentage (%):</label>
    <input type="number" id="percent" placeholder="e.g. 25">

    <label>1 USD = (INR)</label>
    <input type="number" id="rate" value="90" step="0.01">

    <button onclick="calculateIncome()">Calculate</button>

    <div class="result" id="result1" style="display:none;">
      <h3>Result</h3>
      <p id="usdIncome"></p>
      <p id="inrIncome"></p>
      <p id="summary"></p>
    </div>
  </div>

  <!-- 🔹 Advanced Level Calculator -->
  <div class="container">
    <h2>🌐 Level Income Calculator</h2>

    <label>Number of Levels:</label>
    <input type="number" id="levels" value="5" min="1" max="10">

    <label>People in Level 1:</label>
    <input type="number" id="level1people" placeholder="e.g. 10">

    <label>Investment per Person (USD):</label>
    <input type="number" id="perPerson" placeholder="e.g. 100">

    <label>Referral % per Level (comma separated):</label>
    <input type="text" id="refPercents" placeholder="e.g. 10,2,2,2,2">

    <label>1 USD = (INR)</label>
    <input type="number" id="levelRate" value="90" step="0.01">

    <button onclick="calculateLevelIncome()">Calculate Level Income</button>

    <div class="result" id="levelResult" style="display:none;">
      <h3>Level Income Breakdown</h3>
      <div id="levelDetails"></div>
      <hr style="margin: 10px 0;">
      <p id="totalSummary" style="font-weight:600;"></p>
    </div>
  </div>

  <footer>Designed by Mohammad Waqil Khan</footer>

  <script>
    // 🔹 Basic Dollar → INR Calculator
    function calculateIncome() {
      const usd = parseFloat(document.getElementById("usd").value);
      const percent = parseFloat(document.getElementById("percent").value);
      const rate = parseFloat(document.getElementById("rate").value);

      if (isNaN(usd) || isNaN(percent) || usd <= 0 || percent < 0) {
        alert("Please enter valid values!");
        return;
      }

      const incomeUSD = (usd * percent) / 100;
      const incomeINR = incomeUSD * rate;

      document.getElementById("result1").style.display = "block";
      document.getElementById("usdIncome").innerText = `💵 Income in USD: ${incomeUSD.toFixed(2)} USD`;
      document.getElementById("inrIncome").innerText = `🇮🇳 Income in INR: ₹${incomeINR.toFixed(2)}`;
      document.getElementById("summary").innerText =
        `You earned ${incomeUSD.toFixed(2)} USD which equals ₹${incomeINR.toFixed(2)} at ₹${rate}/USD.`;
    }

    // 🔹 Level Income Calculator (with total investment)
    function calculateLevelIncome() {
      const levels = parseInt(document.getElementById("levels").value);
      const firstLevelPeople = parseInt(document.getElementById("level1people").value);
      const perPerson = parseFloat(document.getElementById("perPerson").value);
      const refPercents = document.getElementById("refPercents").value.split(",").map(v => parseFloat(v.trim()));
      const rate = parseFloat(document.getElementById("levelRate").value);

      if (isNaN(levels) || isNaN(firstLevelPeople) || isNaN(perPerson) || refPercents.length < 1) {
        alert("Please fill all details properly!");
        return;
      }

      let levelPeople = firstLevelPeople;
      let totalUSD = 0, totalINR = 0, totalInvest = 0;
      let output = "";

      for (let i = 0; i < levels; i++) {
        const percent = refPercents[i] || 0;
        const levelInvest = levelPeople * perPerson;
        const levelIncomeUSD = (levelInvest * percent) / 100;
        const levelIncomeINR = levelIncomeUSD * rate;

        totalUSD += levelIncomeUSD;
        totalINR += levelIncomeINR;
        totalInvest += levelInvest;

        output += `
          <p><b>Level ${i+1}</b>: ${levelPeople} people × $${perPerson} = <b>$${levelInvest.toFixed(2)}</b> invested</p>
          <p>➡ ${percent}% of $${levelInvest.toFixed(2)} = <b>$${levelIncomeUSD.toFixed(2)} (₹${levelIncomeINR.toFixed(2)})</b></p>
          <hr>
        `;

        levelPeople *= firstLevelPeople; // next level = previous × 10 etc.
      }

      document.getElementById("levelResult").style.display = "block";
      document.getElementById("levelDetails").innerHTML = output;
      document.getElementById("totalSummary").innerHTML =
        `💰 Total Investment: <b>$${totalInvest.toFixed(2)}</b><br>
         🎯 Total Income: <b>$${totalUSD.toFixed(2)} USD</b> ≈ <b>₹${totalINR.toFixed(2)} INR</b>`;
    }
  </script>

</body>
</html>
