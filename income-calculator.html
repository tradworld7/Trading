<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selected Level Income Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: #f5f8ff;
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #fff;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    h2 {
      text-align: center;
      color: #007bff;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: 500;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      transition: 0.2s;
    }

    input:focus {
      border-color: #007bff;
      box-shadow: 0 0 4px rgba(0,123,255,0.3);
    }

    button {
      width: 100%;
      background: #007bff;
      color: white;
      padding: 12px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0056b3;
    }

    .result {
      margin-top: 20px;
      background: #e9f5ff;
      border-radius: 10px;
      padding: 20px;
      border: 1px solid #bde0fe;
      line-height: 1.6;
    }

    .result h3 {
      color: #007bff;
      text-align: center;
      margin-bottom: 15px;
    }

    .result p {
      font-size: 15px;
      margin: 8px 0; /* Added spacing between lines */
    }

    .result section {
      margin-bottom: 12px; /* Gap between groups */
      padding-bottom: 5px;
      border-bottom: 1px dashed #cce5ff;
    }

    .result section:last-child {
      border-bottom: none;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🌐 Selected Level Income Calculator</h2>

    <label>Level Number:</label>
    <input type="number" id="level" min="1" placeholder="e.g. 3">

    <label>Number of People in this Level:</label>
    <input type="number" id="people" placeholder="e.g. 50">

    <label>Investment per Person (USD):</label>
    <input type="number" id="investment" placeholder="e.g. 100">

    <label>Monthly ROI (%):</label>
    <input type="number" id="roi" placeholder="e.g. 8">

    <label>Your Referral % on this Level:</label>
    <input type="number" id="referral" placeholder="e.g. 10">

    <label>1 USD = (INR):</label>
    <input type="number" id="rate" value="90">

    <button onclick="calculateSelectedLevel()">Calculate Selected Level</button>

    <div class="result" id="resultBox" style="display:none;">
      <h3>📘 Selected Level Income Details</h3>
      <div id="details"></div>
    </div>
  </div>

  <footer>Designed by Mohammad Waqil Khan</footer>

  <script>
    function numberToWords(num) {
      const a = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine',
                 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen',
                 'seventeen', 'eighteen', 'nineteen'];
      const b = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];

      if ((num = num.toString()).length > 9) return 'overflow';
      let n = ('000000000' + num).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
      if (!n) return; 
      let str = '';
      str += (n[1] != 0) ? (a[Number(n[1])] || b[n[1][0]] + ' ' + a[n[1][1]]) + ' crore ' : '';
      str += (n[2] != 0) ? (a[Number(n[2])] || b[n[2][0]] + ' ' + a[n[2][1]]) + ' lakh ' : '';
      str += (n[3] != 0) ? (a[Number(n[3])] || b[n[3][0]] + ' ' + a[n[3][1]]) + ' thousand ' : '';
      str += (n[4] != 0) ? (a[Number(n[4])] || b[n[4][0]] + ' ' + a[n[4][1]]) + ' hundred ' : '';
      str += (n[5] != 0) ? ((str != '') ? 'and ' : '') + (a[Number(n[5])] || b[n[5][0]] + ' ' + a[n[5][1]]) + ' ' : '';
      return str.trim() + 'only';
    }

    function calculateSelectedLevel() {
      const level = parseInt(document.getElementById("level").value);
      const people = parseFloat(document.getElementById("people").value);
      const investment = parseFloat(document.getElementById("investment").value);
      const roi = parseFloat(document.getElementById("roi").value);
      const referral = parseFloat(document.getElementById("referral").value);
      const rate = parseFloat(document.getElementById("rate").value);

      if ([level, people, investment, roi, referral, rate].some(v => isNaN(v) || v < 0)) {
        alert("Please enter valid values!");
        return;
      }

      const totalInvestmentUSD = people * investment;
      const totalInvestmentINR = totalInvestmentUSD * rate;

      const totalROIUSD = (totalInvestmentUSD * roi) / 100;
      const totalROINR = totalROIUSD * rate;

      const yourIncomeUSD = (totalROIUSD * referral) / 100;
      const yourIncomeINR = yourIncomeUSD * rate;

      const resultHTML = `
        <section>
          <p><b>Level ${level} Calculation</b></p>
          <p>👥 Total People: <b>${people}</b></p>
          <p>💵 Investment per Person: $${investment.toFixed(2)} USD</p>
        </section>

        <section>
          <p>💰 Total Investment: <b>$${totalInvestmentUSD.toFixed(2)}</b> USD 
          (${numberToWords(totalInvestmentUSD.toFixed(0))})</p>
          <p>≈ ₹${totalInvestmentINR.toFixed(2)} INR 
          (${numberToWords(totalInvestmentINR.toFixed(0))})</p>
        </section>

        <section>
          <p>📈 Monthly ROI (${roi}%): <b>$${totalROIUSD.toFixed(2)}</b> USD 
          (${numberToWords(totalROIUSD.toFixed(0))})</p>
          <p>≈ ₹${totalROINR.toFixed(2)} INR 
          (${numberToWords(totalROINR.toFixed(0))})</p>
        </section>

        <section>
          <p>💸 Your Income (${referral}% of ROI): <b>$${yourIncomeUSD.toFixed(2)}</b> USD 
          (${numberToWords(yourIncomeUSD.toFixed(0))})</p>
          <p>≈ ₹${yourIncomeINR.toFixed(2)} INR 
          (${numberToWords(yourIncomeINR.toFixed(0))})</p>
        </section>

        <section>
          <p>🎯 Total Income from Level ${level}: <b>$${yourIncomeUSD.toFixed(2)}</b> USD 
          (${numberToWords(yourIncomeUSD.toFixed(0))})</p>
          <p>≈ ₹${yourIncomeINR.toFixed(2)} INR 
          (${numberToWords(yourIncomeINR.toFixed(0))})</p>
        </section>
      `;

      document.getElementById("details").innerHTML = resultHTML;
      document.getElementById("resultBox").style.display = "block";
    }
  </script>

</body>
</html>
