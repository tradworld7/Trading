<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Trade World</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
    body{background:#eef2f3;display:flex;align-items:center;justify-content:center;min-height:100vh;}
    .profile-container{background:#fff;padding:2rem;border-radius:10px;box-shadow:0 0 15px rgba(0,0,0,0.1);width:100%;max-width:420px;}
    h2{text-align:center;margin-bottom:1.5rem;}
    label{font-weight:500;margin-top:1rem;display:block;}
    input{width:100%;padding:0.75rem;margin-top:0.4rem;border:1px solid #ccc;border-radius:5px;}
    button{width:100%;padding:0.75rem;background:#4361ee;color:#fff;border:none;border-radius:5px;margin-top:1.5rem;cursor:pointer;}
    button:hover{background:#3b4cca;}
    .message{margin-top:1rem;text-align:center;font-size:0.9rem;}
    .error{color:red;}
    .success{color:green;}
    .logout{text-align:center;margin-top:1rem;}
    .logout a{color:red;text-decoration:none;}
  </style>
</head>
<body>
<div class="profile-container">
  <h2>My Profile</h2>
  <label for="fullName">Full Name</label>
  <input type="text" id="fullName" placeholder="Enter your full name" />
  <label for="mobile">Mobile Number</label>
  <input type="text" id="mobile" placeholder="Enter your mobile number" />
  <label for="email">Email</label>
  <input type="text" id="email" disabled />
  <button id="saveBtn">Save Changes</button>
  <div class="message" id="msgBox"></div>
  <div class="logout"><a href="#" id="logoutBtn">Logout</a></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-auth.js";
  import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCzHmIimieea8H9KzYFDSqD0lGOCZjxHYw",
    authDomain: "myapp-ee226.firebaseapp.com",
    databaseURL: "https://myapp-ee226-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "myapp-ee226",
    storageBucket: "myapp-ee226.firebasestorage.app",
    messagingSenderId: "272405753135",
    appId: "1:272405753135:web:598ec27c28bcf6b04105da",
    measurementId: "G-D5KYTMJ5WK"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const fullNameEl = document.getElementById('fullName');
  const mobileEl = document.getElementById('mobile');
  const emailEl = document.getElementById('email');
  const saveBtn = document.getElementById('saveBtn');
  const msgBox = document.getElementById('msgBox');
  const logoutBtn = document.getElementById('logoutBtn');

  let currentUser = null;

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      emailEl.value = user.email;
      const snap = await get(ref(db, 'users/' + user.uid));
      if (snap.exists()) {
        const data = snap.val();
        fullNameEl.value = data.name || '';
        mobileEl.value = data.mobile || '';
      }
    } else {
      window.location.href = "login.html";
    }
  });

  saveBtn.addEventListener('click', async () => {
    const name = fullNameEl.value.trim();
    const mobile = mobileEl.value.trim();
    if (!name || !mobile) {
      msgBox.innerHTML = '<div class="error">All fields are required.</div>';
      return;
    }
    try {
      await update(ref(db, 'users/' + currentUser.uid), {
        name: name,
        mobile: mobile
      });
      msgBox.innerHTML = '<div class="success">Profile updated successfully!</div>';
    } catch (error) {
      msgBox.innerHTML = `<div class="error">${error.message}</div>`;
    }
  });

  logoutBtn.addEventListener('click', (e) => {
    e.preventDefault();
    signOut(auth).then(() => {
      window.location.href = "login.html";
    });
  });
</script>
</body>
</html>
